<line class="grid" x1="624.0" x2="624.0" y1="70" y2="204" stroke-width="1"/>
<text class="tick" x="624.0" y="222" text-anchor="middle">50K</text>
<text class="label" x="118" y="95.0" text-anchor="end">Compose HTML</text>
<path class="bar" d="M130,78 H545.4 Q549.4,78 549.4,82 V98 Q549.4,102 545.4,102 H130 Z"/>
<text class="value" x="557.4" y="95.0">42,453</text>
<text class="label" x="118" y="141.0" text-anchor="end">JMustache</text>
<path class="bar" d="M130,124 H173.2 Q177.2,124 177.2,128 V144 Q177.2,148 173.2,148 H130 Z"/>
<text class="value" x="185.2" y="141.0">4,779</text>
<text class="label" x="118" y="187.0" text-anchor="end">Thymeleaf</text>
<path class="bar" d="M130,170 H165.1 Q169.1,170 169.1,174 V190 Q169.1,194 165.1,194 H130 Z"/>
