<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="t d">
<title id="t">Rendering throughput of the TODO page listing 10 todos</title>
<desc id="d">Compose HTML: 42,453 pages per second, JMustache: 4,779 pages per second, Thymeleaf: 3,953 pages per second</desc>
<style>
  .surface { fill: #fcfcfb; } .bar { fill: #2a78d6; } .grid { stroke: #e1e0d9; } .base { stroke: #c3c2b7; }
  .title { fill: #0b0b0b; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .sub { fill: #52514e; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .label { fill: #0b0b0b; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .value { fill: #0b0b0b; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .tick { fill: #898781; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .bar { fill: #3987e5; } .grid { stroke: #2c2c2a; } .base { stroke: #383835; }
    .title, .label, .value { fill: #f0efec; } .sub { fill: #c3c2b7; }
  }
</style>
<rect class="surface" width="720" height="256" rx="8"/>
<text class="title" x="20" y="30">Rendering throughput, TODO page listing 10 todos</text>
<text class="sub" x="20" y="52">Pages rendered per second on one thread, higher is better</text>
<line class="grid" x1="130.0" x2="130.0" y1="70" y2="204" stroke-width="1"/>
