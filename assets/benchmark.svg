<line class="grid" x1="327.6" x2="327.6" y1="70" y2="204" stroke-width="1"/>
<text class="tick" x="327.6" y="222" text-anchor="middle">20K</text>
<line class="grid" x1="426.4" x2="426.4" y1="70" y2="204" stroke-width="1"/>
<text class="tick" x="426.4" y="222" text-anchor="middle">30K</text>
<line class="grid" x1="525.2" x2="525.2" y1="70" y2="204" stroke-width="1"/>
